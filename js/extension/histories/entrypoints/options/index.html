<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Histories</title>
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <header class="topbar">
            <div class="brand"><span class="brand-mark">H</span><strong>Histories</strong></div>
            <nav aria-label="页面导航">
                <a href="#history">历史</a><a href="#data">数据管理</a><a href="#tasks">任务</a>
            </nav>
            <span id="runtimeStatus" class="runtime-badge">连接中</span>
        </header>

        <main>
            <section id="history" class="history-band">
                <form id="searchForm" class="search-toolbar">
                    <label class="keyword-field"
                        ><span>关键词</span
                        ><input id="keyword" type="search" placeholder="标题或 URL，至少 3 个字符" autocomplete="off"
                    /></label>
                    <label><span>开始时间</span><input id="fromTime" type="datetime-local" /></label>
                    <label><span>结束时间</span><input id="toTime" type="datetime-local" /></label>
                    <button id="searchButton" class="primary" type="submit">搜索</button>
                    <button id="nextPageButton" type="button" disabled>下一页</button>
                </form>

                <div class="summary-strip" aria-label="存储状态">
                    <div><span>主数据</span><strong id="storageStatus">读取中</strong></div>
                    <div><span>搜索索引</span><strong id="snapshotStatus">读取中</strong></div>
                    <div><span>浏览器存储</span><strong id="quotaStatus">读取中</strong></div>
                    <div><span>当前任务</span><strong id="jobStatus">空闲</strong></div>
                </div>

                <section class="results-panel" aria-labelledby="resultsTitle">
                    <div class="section-head"
                        ><h1 id="resultsTitle">历史记录</h1><span id="resultSummary">尚未查询</span></div
                    >
                    <div id="results" class="empty-state">输入关键词或选择时间范围开始查询。</div>
                </section>
            </section>

            <section id="data" class="management-band">
                <div class="section-head"><h2>数据管理</h2><span>导入不会覆盖已有记录</span></div>
                <div class="management-grid">
                    <div class="control-group">
                        <h3>HTU 数据</h3>
                        <label class="file-box"
                            ><span>选择一个或多个 TSV</span
                            ><input id="importFile" type="file" multiple accept=".tsv,text/tab-separated-values"
                        /></label>
                        <div class="button-row"
                            ><button id="importButton" class="primary" type="button">导入 HTU</button
                            ><button id="cancelImportButton" type="button" disabled>取消</button
                            ><button id="exportButton" type="button">导出 HTU</button
                            ><button id="cancelExportButton" type="button" disabled>取消</button></div
                        >
                    </div>
                    <div class="control-group">
                        <h3>完整备份</h3>
                        <label class="file-box"
                            ><span>Histories 原生备份</span
                            ><input id="nativeRestoreFile" type="file" accept=".hbk,application/x-histories-backup"
                        /></label>
                        <div class="button-row"
                            ><button id="nativeExportButton" class="primary" type="button">导出完整备份</button
                            ><button id="nativeRestoreButton" type="button">恢复到空库</button></div
                        >
                    </div>
                    <div class="control-group">
                        <h3>采集与索引</h3>
                        <label
                            ><span>同一 URL 忽略秒数</span
                            ><input id="frequentVisitThreshold" type="number" min="0" step="0.1" value="2"
                        /></label>
                        <div class="button-row"
                            ><button id="saveSyncSettingsButton" type="button">保存</button
                            ><button id="syncButton" class="primary" type="button">立即补全</button
                            ><button id="cancelSyncButton" type="button" disabled>取消</button
                            ><button id="rebuildButton" type="button">重建索引</button
                            ><button id="cancelRebuildButton" type="button" disabled>取消</button></div
                        >
                    </div>
                </div>
            </section>

            <section id="tasks" class="tasks-band">
                <div class="section-head"><h2>最近任务</h2><span>页面重开后仍可查看</span></div>
                <div id="jobsList" class="job-list empty-state">暂无任务。</div>
            </section>
        </main>
    </body>
</html>
